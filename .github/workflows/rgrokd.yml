name: rgrokd

# Builds and publishes the rgrokd server binary and Docker image.
#
# On push to main:
#   - Linux amd64/arm64 binaries are uploaded as workflow artifacts (retained 90 days).
#   - Multi-arch Docker image is pushed to ghcr.io as :latest.
#
# On release published:
#   - Linux amd64/arm64 binary archives are attached to the release.
#   - Multi-arch Docker image is pushed to ghcr.io as :<version> and :latest.

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: "https://proxy.golang.org"
  IMAGE: ghcr.io/${{ github.repository_owner }}/rgrokd

permissions:
  contents: write
  packages: write

jobs:
  binary:
    name: rgrokd ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: |
            - cwd: rgrokd/web

      - name: Build web app
        run: pnpm --dir rgrokd/web run build

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -v \
            -ldflags "-X main.version=${{ steps.version.outputs.version }}" \
            -trimpath -o "dist/rgrokd" ./rgrokd/cli

      - name: Create archive
        working-directory: dist
        run: |
          ARCHIVE="rgrokd_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czvf "$ARCHIVE" rgrokd
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload artifact (push to main)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: rgrokd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ env.ARCHIVE }}
          retention-days: 90

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ env.ARCHIVE }}" --clobber

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version and tags
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          else
            VERSION="$(git rev-parse --short HEAD)"
            TAGS="${IMAGE}:latest"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.event_name == 'release' && steps.meta.outputs.version || 'latest' }}
          exit-code: '1'
          ignore-unfixed: true
